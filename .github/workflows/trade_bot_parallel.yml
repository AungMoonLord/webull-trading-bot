name: Webull Trading Bot (Daily 10:00 PM Parallel)

on:
  schedule:
    # 22:00 น. เวลาไทย (UTC+7) = 15:00 UTC ทุกวัน
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-expanding:
    name: Run expanding_window
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Expanding_Window/webull_live_trading/requirements.txt"

      - name: Install dependencies
        working-directory: Expanding_Window/webull_live_trading
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Trading
        working-directory: Expanding_Window/webull_live_trading
        env:
          WEBULL_APP_KEY: ${{ secrets.EXPANDING_WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.EXPANDING_WEBULL_APP_SECRET }}
          WEBULL_ACCOUNT_ID: ${{ secrets.EXPANDING_WEBULL_ACCOUNT_ID }}
          WEBULL_ENV: "sandbox"
          TELEGRAM_BOT_TOKEN: ${{ secrets.EXPANDING_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.EXPANDING_TELEGRAM_CHAT_ID }}
        run: |
          python run_live.py --scheme expanding_window --algo ppo --execute

  run-sliding:
    name: Run sliding_window
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Sliding_Window/webull_live_trading/requirements.txt"

      - name: Install dependencies
        working-directory: Sliding_Window/webull_live_trading
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Trading
        working-directory: Sliding_Window/webull_live_trading
        env:
          WEBULL_APP_KEY: ${{ secrets.SLIDING_WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.SLIDING_WEBULL_APP_SECRET }}
          WEBULL_ACCOUNT_ID: ${{ secrets.SLIDING_WEBULL_ACCOUNT_ID }}
          WEBULL_ENV: "sandbox"
          TELEGRAM_BOT_TOKEN: ${{ secrets.SLIDING_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SLIDING_TELEGRAM_CHAT_ID }}
        run: |
          python run_live.py --scheme sliding_window --algo ppo --execute

  run-single:
    name: Run single_holdout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Single_Holdout/webull_live_trading/requirements.txt"

      - name: Install dependencies
        working-directory: Single_Holdout/webull_live_trading
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Trading
        working-directory: Single_Holdout/webull_live_trading
        env:
          WEBULL_APP_KEY: ${{ secrets.SINGLE_WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.SINGLE_WEBULL_APP_SECRET }}
          WEBULL_ACCOUNT_ID: ${{ secrets.SINGLE_WEBULL_ACCOUNT_ID }}
          WEBULL_ENV: "sandbox"
          TELEGRAM_BOT_TOKEN: ${{ secrets.SINGLE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SINGLE_TELEGRAM_CHAT_ID }}
        run: |
          python run_live.py --scheme single_holdout --algo ppo --execute