name: Webull Trading Bot (Daily 10:00 PM Parallel)

on:
  schedule:
    # 22:00 น. เวลาไทย (UTC+7) = 15:00 UTC ทุกวัน
    - cron: '0 15 * * *'

  # เปิดให้กดปุ่มสั่งรันด้วยมือผ่านหน้าเว็บ GitHub ได้ตามปกติ
  workflow_dispatch:

jobs:
  run-trading-schemes:
    name: Run ${{ matrix.scheme_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme_name: "expanding_window"
            folder_dir: "Expanding_Window/webull_live_trading"
            app_key: "${{ secrets.EXPANDING_WEBULL_APP_KEY }}"
            app_secret: "${{ secrets.EXPANDING_WEBULL_APP_SECRET }}"
            account_id: "${{ secrets.EXPANDING_WEBULL_ACCOUNT_ID }}"
            bot_token: "${{ secrets.EXPANDING_TELEGRAM_BOT_TOKEN }}"
            chat_id: "${{ secrets.EXPANDING_TELEGRAM_CHAT_ID }}"

          - scheme_name: "sliding_window"
            folder_dir: "Sliding_Window/webull_live_trading"
            app_key: "${{ secrets.SLIDING_WEBULL_APP_KEY }}"
            app_secret: "${{ secrets.SLIDING_WEBULL_APP_SECRET }}"
            account_id: "${{ secrets.SLIDING_WEBULL_ACCOUNT_ID }}"
            bot_token: "${{ secrets.SLIDING_TELEGRAM_BOT_TOKEN }}"
            chat_id: "${{ secrets.SLIDING_TELEGRAM_CHAT_ID }}"

          - scheme_name: "single_holdout"
            folder_dir: "Single_Holdout/webull_live_trading"
            app_key: "${{ secrets.SINGLE_WEBULL_APP_KEY }}"
            app_secret: "${{ secrets.SINGLE_WEBULL_APP_SECRET }}"
            account_id: "${{ secrets.SINGLE_WEBULL_ACCOUNT_ID }}"
            bot_token: "${{ secrets.SINGLE_TELEGRAM_BOT_TOKEN }}"
            chat_id: "${{ secrets.SINGLE_TELEGRAM_CHAT_ID }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "${{ matrix.folder_dir }}/requirements.txt"

      - name: Install dependencies
        working-directory: ${{ matrix.folder_dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Trading (${{ matrix.scheme_name }})
        working-directory: ${{ matrix.folder_dir }}
        env:
          # แมปค่าประจำแต่ละ Scheme เข้าสู่ Environment Variable ชื่อเดิมที่สคริปต์ Python เรียกหา
          WEBULL_APP_KEY: ${{ matrix.app_key }}
          WEBULL_APP_SECRET: ${{ matrix.app_secret }}
          WEBULL_ACCOUNT_ID: ${{ matrix.account_id }}
          WEBULL_ENV: "sandbox"
          TELEGRAM_BOT_TOKEN: ${{ matrix.bot_token }}
          TELEGRAM_CHAT_ID: ${{ matrix.chat_id }}
        run: |
          python run_live.py --scheme ${{ matrix.scheme_name }} --algo ppo --execute